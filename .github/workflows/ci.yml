# Gerbang integrasi SIGAP — tahap awal alur 04-TRD §8.2.
#
# Yang sudah ditegakkan di sini: verifikasi dokumen, lint (termasuk batas modul
# ADR-01 dan larangan egress ADR-03), pemeriksaan tipe, uji unit, dan validasi
# skema Prisma.
#
# Yang BELUM ada dan harus menyusul sebelum produksi, sesuai §8.2:
#   - uji integrasi terhadap PostgreSQL sementara
#   - pemindaian keamanan kode & ketergantungan
#   - bangun dan pindai citra kontainer
#   - ambang cakupan: 70% keseluruhan, 90% untuk otorisasi, gerbang LLM, dan
#     jejak audit
# Daftar ini sengaja ditulis agar ketiadaannya terlihat, bukan terlupakan.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: Verifikasi dokumen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Dokumen adalah sumber kebenaran (CLAUDE.md). Keterlacakan ID yang putus
      # menggagalkan build, bukan sekadar memberi peringatan.
      - run: python3 .claude/skills/verify-docs/scripts/verify.py docs

  code:
    name: Lint, tipe, uji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      # --frozen-lockfile: CI tidak boleh diam-diam menyelesaikan versi yang
      # berbeda dari yang diuji di mesin pengembang. Kegagalan di sini berarti
      # bun.lock tertinggal, dan itu memang harus menghentikan build.
      - run: bun install --frozen-lockfile
      # Klien Prisma dihasilkan, bukan disimpan di repo. Tanpa langkah ini
      # typecheck melaporkan ratusan galat "implicitly has an 'any' type" yang
      # menunjuk ke kode aplikasi, bukan ke penyebab sebenarnya.
      - run: bun run db:generate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
